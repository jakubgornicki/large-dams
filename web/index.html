<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Past the Expiration Date — Europe's ageing dams</title>
<meta name="description" content="An interactive map of Europe's ageing large dams and how four countries handle continued operation without an automatic new environmental assessment." />
<script>if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');</script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/scrollama"></script>
<style>
  :root{
    --bg:#0f1113; --panel:#16191c; --panel2:#1b1f23; --ink:#f2f4f5; --muted:#898781; --sec:#c3c2b7; --line:#2c2c2a;
    /* validated diverging age ramp (around the 50-yr alert age) */
    --a-lt25:#35b0c9; --a-25:#3d7fe0; --a-50:#f0842e; --a-75:#e5352b; --a-unknown:#6b7280;
    --past:#d03b3b; --notyet:#2f7fd6; --accent:#e5352b;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}

  /* ---- fixed map layer ---- */
  #map{position:fixed;inset:0;width:100%;height:100vh;z-index:0}
  #map.dimmed:after{content:"";position:absolute;inset:0;background:rgba(15,17,19,.72);transition:background .6s}

  .maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.55);max-width:260px}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  .maplibregl-popup-close-button{color:var(--muted);font-size:18px;padding:2px 7px}
  .pop-name{font-weight:700;font-size:15px;margin:0 0 2px}
  .pop-sub{color:var(--muted);margin:0 0 8px;font-size:12px}
  .pop-row{display:flex;justify-content:space-between;gap:16px;padding:3px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .pop-flag{margin-top:9px;font-size:12px;padding:5px 8px;border-radius:5px}
  .pop-flag.over{background:rgba(229,53,43,.16);color:#f2a59d;border:1px solid rgba(229,53,43,.4)}
  .pop-flag.under{background:rgba(107,114,128,.2);color:var(--sec);border:1px solid var(--line)}

  /* ---- persistent chrome ---- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;pointer-events:none}
  .brandmark{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sec);background:rgba(15,17,19,.6);padding:6px 10px;border-radius:6px;backdrop-filter:blur(6px);pointer-events:auto}
  .langtoggle{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;pointer-events:auto;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  .langtoggle button{background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:6px 10px;border-radius:5px;cursor:pointer;font-family:var(--sans)}
  .langtoggle button.active{background:var(--accent);color:#fff}

  .legend{position:fixed;left:16px;bottom:20px;z-index:5;background:rgba(22,25,28,.92);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.4);backdrop-filter:blur(6px);transition:opacity .4s;max-width:200px}
  .legend.hide{opacity:0;pointer-events:none}
  .legend h4{margin:0 0 8px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .legend .li{display:flex;align-items:center;gap:8px;padding:2px 0}
  .legend .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto;border:.5px solid rgba(0,0,0,.4)}

  /* ---- scrolly steps ---- */
  .scrolly{position:relative;z-index:2}
  .step{min-height:100vh;display:flex;align-items:center;padding:10vh 0}
  .step .card{pointer-events:auto;max-width:430px;margin:0 20px;background:rgba(15,17,19,.9);border:1px solid var(--line);border-radius:14px;padding:26px 28px;box-shadow:0 16px 50px rgba(0,0,0,.5);backdrop-filter:blur(8px)}
  .step.right .card{margin-left:auto;margin-right:24px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 12px}
  .step h2{font-family:var(--serif);font-weight:700;font-size:clamp(22px,3.6vw,30px);line-height:1.22;margin:0 0 14px;letter-spacing:-.01em}
  .step p.body{color:var(--sec);font-size:15px;line-height:1.6;margin:0}
  .step .body + .body{margin-top:12px}

  /* hero */
  #hero .card{background:rgba(15,17,19,.86)}
  .counter{font-size:clamp(48px,10vw,92px);line-height:.92;font-weight:800;letter-spacing:-.03em;margin:0;color:#fff;font-variant-numeric:tabular-nums}
  .headline{font-family:var(--serif);font-size:clamp(18px,3.2vw,24px);line-height:1.32;margin:8px 0 0}
  .alert-context{color:var(--sec);font-size:13px;line-height:1.55;margin:16px 0 0}
  .data-note{color:var(--muted);font-size:11.5px;line-height:1.5;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
  .data-note a{color:var(--sec)}
  .scrollcue{margin-top:20px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

  /* callout stat inside a step */
  .callout{margin-top:16px;padding:14px 16px;background:rgba(229,53,43,.1);border:1px solid rgba(229,53,43,.32);border-radius:10px}
  .callout b{font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;display:block;line-height:1}
  .callout span{font-size:13px;color:var(--sec);display:block;margin-top:5px}

  /* decade chart */
  .chart-wrap{margin-top:18px}
  .chart-legend{display:flex;gap:16px;font-size:11.5px;color:var(--sec);margin:0 0 10px}
  .chart-legend .li{display:flex;align-items:center;gap:6px}
  .chart-legend .sw{width:10px;height:10px;border-radius:2px}
  .chart{width:100%;height:150px;display:block}
  .chart .bar{transition:opacity .2s}
  .chart text{fill:var(--muted);font-size:9px;font-family:var(--sans)}
  .chart .axislbl{fill:var(--sec)}
  .chart-cap{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.4}

  /* country stepper cards */
  .ccard .flag-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
  .ccard .cnum{font-size:40px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
  .ccard .cnum small{font-size:14px;font-weight:600;color:var(--muted)}
  .ccard .cnote{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
  .ccount{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}

  /* solid panels (payload + what-now) */
  .panel{position:relative;z-index:2;background:var(--bg);border-top:1px solid var(--line);padding:70px 20px}
  .panel-inner{max-width:960px;margin:0 auto}
  .panel .eyebrow{color:var(--accent)}
  .panel h2{font-family:var(--serif);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0 0 16px;max-width:20ch;letter-spacing:-.01em}
  .panel h2:empty,.section-kicker:empty{display:none}
  .section-kicker{max-width:34ch;margin:0 0 16px;color:var(--ink);font-family:var(--serif);font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.25}
  .panel p.lead{font-size:17px;color:var(--sec);max-width:60ch;margin:0 0 36px;line-height:1.6}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px}
  .tile .v{font-size:clamp(30px,4vw,40px);font-weight:800;color:#fff;line-height:1;letter-spacing:-.02em}
  .tile .v.red{color:#f0645a}
  .tile .l{font-size:13.5px;color:var(--sec);margin-top:10px;line-height:1.45}
  .tiles.table-fallback{margin-top:0}

  /* what-now */
  .cta-target{font-size:clamp(40px,8vw,72px);font-weight:800;color:#fff;letter-spacing:-.03em;line-height:.95;margin:0 0 8px;font-variant-numeric:tabular-nums}
  .cta-target small{display:block;font-size:16px;font-weight:600;color:var(--sec);letter-spacing:0;margin-top:8px;max-width:30ch}
  .rec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:20px 22px;margin:30px 0;max-width:60ch}
  .rec b{color:#fff}
  .links{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .links a{display:inline-block;padding:12px 20px;border-radius:9px;font-size:14px;font-weight:600;text-decoration:none}
  .links a.primary{background:var(--accent);color:#fff}
  .links a.ghost{background:transparent;color:var(--sec);border:1px solid var(--line)}
  .footnote{font-size:12px;color:var(--muted);margin-top:44px;line-height:1.6;border-top:1px solid var(--line);padding-top:20px}
  .footnote a{color:var(--sec)}

  .credit{position:fixed;right:8px;bottom:4px;z-index:5;font-size:9.5px;color:var(--muted);opacity:.75}
  .credit a{color:var(--muted)}

  /* The embed fills its iframe and keeps the narrative out of the map's way. */
  .embed-controls{display:none}
  html.embed,html.embed body{height:100%;overflow:hidden}
  .embed #map{height:100%}
  .embed .scrolly,.embed .panel,.embed .credit{display:none}
  .embed .topbar{padding:8px;gap:8px}
  .embed .brandmark{display:none}
  .embed .langtoggle{margin-left:auto}
  .embed .embed-controls{display:flex;position:fixed;top:58px;left:8px;right:8px;z-index:6;gap:6px;flex-wrap:wrap;pointer-events:none}
  .embed-controls select,.embed-controls button,.embed-controls a{pointer-events:auto;font:12px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;text-decoration:none;max-width:100%}
  .embed-controls button{cursor:pointer}
  .embed .legend{left:8px;bottom:30px;max-width:180px;font-size:11px;padding:8px 10px}
  .embed .maplibregl-ctrl-top-right{top:106px}
  .embed .maplibregl-ctrl-attrib{max-width:calc(100vw - 16px)}

  @media (max-width:640px){
    .step{padding:6vh 0;align-items:flex-end}
    .step .card,.step.right .card{margin:0 12px 12vh;max-width:none;padding:20px 20px}
    .legend{left:12px;bottom:12px;font-size:11px;padding:9px 11px}
    .panel{padding:52px 16px}
    .brandmark{display:none}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chart .bar{transition:none}}
</style>
</head>
<body data-palette="#35b0c9,#3d7fe0,#f0842e,#e5352b">
<div id="map"></div>

<div class="topbar">
  <span class="brandmark" data-i18n="brand">Past the Expiration Date</span>
  <span class="langtoggle" id="lang">
    <button data-lang="en" class="active">EN</button>
    <button data-lang="pl">PL</button>
  </span>
</div>

<div class="legend hide" id="legend"><h4 id="legend-title"></h4><div id="legend-items"></div></div>

<div class="embed-controls">
  <select id="embed-mode" aria-label="Map colours" disabled>
    <option value="age" data-i18n="embed_age"></option>
    <option value="decade" data-i18n="embed_alert"></option>
    <option value="threshold" data-i18n="embed_capacity"></option>
  </select>
  <button id="embed-reset" type="button" data-i18n="embed_reset" disabled></button>
  <a id="embed-story" href="./" target="_blank" rel="noopener" data-i18n="embed_story"></a>
</div>

<div class="scrolly" id="scrolly">

  <!-- 1 · HERO -->
  <section class="step" id="hero" data-step="hero">
    <div class="card">
      <p class="eyebrow" data-i18n="brand"></p>
      <p class="counter"><span id="count">0</span></p>
      <p class="headline" data-i18n="hero_headline"></p>
      <p class="alert-context" data-i18n="hero_alert_context"></p>
      <p class="data-note" data-i18n-html="hero_data_note"></p>
      <p class="scrollcue" data-i18n="scrollcue"></p>
    </div>
  </section>

  <!-- 2 · ALERT AGE -->
  <section class="step" data-step="alert">
    <div class="card">
      <p class="eyebrow" data-i18n="s3_eyebrow"></p>
      <h2 data-i18n="s3_title"></h2>
      <p class="body" data-i18n="s3_body"></p>
      <div class="callout"><b id="alert-num">—</b><span data-i18n="s3_callout"></span></div>
    </div>
  </section>

  <!-- 3 · DECADE -->
  <section class="step right" data-step="decade">
    <div class="card">
      <p class="eyebrow" data-i18n="s2_eyebrow"></p>
      <h2 data-i18n="s2_title"></h2>
      <p class="body" data-i18n="s2_body"></p>
      <div class="chart-wrap">
        <div class="chart-legend">
          <span class="li"><span class="sw" style="background:var(--past)"></span><span data-i18n="chart_past"></span></span>
          <span class="li"><span class="sw" style="background:var(--notyet)"></span><span data-i18n="chart_notyet"></span></span>
        </div>
        <svg class="chart" id="decade-chart" role="img" aria-labelledby="decade-cap"></svg>
        <p class="chart-cap" id="decade-cap" data-i18n="s2_cap"></p>
      </div>
    </div>
  </section>

  <!-- 4 · LOOPHOLE -->
  <section class="step right" data-step="loophole">
    <div class="card">
      <p class="eyebrow" data-i18n="s4_eyebrow"></p>
      <h2 data-i18n="s4_title"></h2>
      <p class="body" data-i18n="s4_body_intro"></p>
      <p class="body" data-i18n="s4_body"></p>
    </div>
  </section>

  <!-- 4b · COUNTRY STEPPER -->
  <section class="step right" data-step="country" data-country="Poland">
    <div class="card ccard" id="cc-Poland"></div>
  </section>
  <section class="step right" data-step="country" data-country="Italy">
    <div class="card ccard" id="cc-Italy"></div>
  </section>
  <section class="step right" data-step="country" data-country="Bulgaria">
    <div class="card ccard" id="cc-Bulgaria"></div>
  </section>
  <section class="step right" data-step="country" data-country="Romania">
    <div class="card ccard" id="cc-Romania"></div>
  </section>

</div>

<!-- 5 · PAYLOAD (solid panel) -->
<section class="panel" data-step="payload">
  <div class="panel-inner">
    <p class="eyebrow" data-i18n="s5_eyebrow"></p>
    <h2 data-i18n="s5_heading"></h2>
    <p class="section-kicker" data-i18n="s5_title"></p>
    <p class="lead" data-i18n="s5_lead"></p>
    <div class="tiles" id="payload-tiles"></div>
  </div>
</section>

<!-- 6 · WHAT NOW (solid panel) -->
<section class="panel" data-step="whatnow">
  <div class="panel-inner">
    <p class="eyebrow" data-i18n="s6_eyebrow"></p>
    <h2 data-i18n="s6_title"></h2>
    <p class="cta-target"><small data-i18n="s6_target_prefix"></small><span data-i18n="s6_target_value"></span><small data-i18n="s6_target_sub"></small></p>
    <p class="lead" data-i18n="s6_body"></p>
    <div class="rec" data-i18n-html="s6_rec"></div>
    <div class="links">
      <a class="primary" id="link-brief" href="#" data-i18n="s6_link_brief"></a>
      <a class="ghost" href="methodology.html?lang=en" data-methodology-link data-i18n="s6_link_method"></a>
    </div>
    <p class="footnote" data-i18n-html="footnote"></p>
  </div>
</section>

<span class="credit">Dams: Global Dam Watch v1.0 · © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>, © OpenStreetMap</span>

<script src="copy.js"></script>
<script src="app.js"></script>
</body>
</html>
